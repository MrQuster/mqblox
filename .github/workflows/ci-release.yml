name: CI & Release

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build C++20/Qt6 & Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            libqt6svg6-dev \
            libqt6opengl6-dev \
            clang \
            lld \
            unzip

      - name: Verify Darwin Mach-O audio_hal.c syntax
        run: |
          clang -fsyntax-only -Wall -Wextra -Wpedantic -Wno-unused-parameter -Werror \
            -target x86_64-apple-darwin -mmacosx-version-min=11.0 \
            shims/audio_hal.c

      - name: Configure CMake (Release)
        run: |
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build MqBlox & Test Suite
        run: cmake --build build

      - name: Run Unit Tests (ctest)
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure -V

      - name: Test staged installation
        run: DESTDIR="$PWD/pkg-stage" cmake --install build

  release:
    name: Publish GitHub Release on Tag
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package source archive & SHA256SUMS
        run: |
          TAG="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="mqblox-${TAG}/" -o "mqblox-${TAG}.tar.gz" HEAD
          cp -f "mqblox-${TAG}.tar.gz" "mqblox-source.tar.gz"
          sha256sum "mqblox-${TAG}.tar.gz" "mqblox-source.tar.gz" PKGBUILD install.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mqblox-${{ github.ref_name }}.tar.gz
            mqblox-source.tar.gz
            PKGBUILD
            install.sh
            SHA256SUMS
